<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Anti-Phishing Test</title>

        <!--Linking the JavaScript-->
        <script src="static/email.js" defer></script>
        
        <!--The google font Oswald-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

        <!--The google font Google Sans, used so capital i and lowercase l get confused as often as possible-->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        
        <!--Link to the stylesheet-->
        <link rel="stylesheet" href="static/style.css">
    </head>
    <body class="email_body">
        
        <!--Making the email-->
        <h1 id="output" style="align-self: center;">Generating email...</h1>

        <h4 style="align-self: center;">Do you think this a phishing email?</h4>

        <div style="display: flex; flex-direction: row; gap: 10px; align-self: center; align-items: center; margin-left: 20%;">
            <button onclick="checkAnswer()" id="yesbutton" value="YES" style="display: inline-block; height: 25px; width: 50px;">Yes</button>
            <button onclick="checkAnswer()" id="nobutton" value="NO" style="display: inline-block; height: 25px; width: 50px;">No</button>
        </div>
        
    </body>
</html>
